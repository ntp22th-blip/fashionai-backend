<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <title>Fashion AI — Test Màu Cá Nhân</title>
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <style>
      :root {
        --bg1: #f6f8fb;
        --card: #ffffff;
        --muted: #6b7280;
        --accent: linear-gradient(90deg, #ff4da6, #6c8cff);
        --radius: 14px;
      }

      body {
        margin: 0;
        font-family: "Inter", system-ui, Segoe UI, Roboto, sans-serif;
        background: var(--bg1);
        color: #111827;
      }

      header {
        max-width: 1000px;
        margin: 20px auto;
        padding: 0 16px;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      header h1 {
        font-size: 20px;
        margin: 0;
      }

      header p {
        margin: 4px 0 0;
        color: var(--muted);
        font-size: 14px;
      }

      .btn {
        padding: 10px 14px;
        border-radius: 10px;
        border: none;
        background: var(--accent);
        color: #fff;
        font-weight: 600;
        cursor: pointer;
      }

      .container {
        display: grid;
        grid-template-columns: 340px 1fr;
        gap: 20px;
        max-width: 1000px;
        margin: 20px auto;
        padding: 0 16px;
      }

      @media (max-width: 900px) {
        .container {
          grid-template-columns: 1fr;
        }
      }

      .card {
        background: var(--card);
        border-radius: var(--radius);
        padding: 20px;
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.05);
      }

      #preview {
        width: 100%;
        border-radius: 10px;
        margin-top: 10px;
        display: none;
        object-fit: cover;
        max-height: 380px;
      }

      .palette {
        display: flex;
        gap: 8px;
        margin-top: 8px;
      }

      .color {
        width: 40px;
        height: 40px;
        border-radius: 8px;
        border: 1px solid #e5e7eb;
      }

      .choice {
        padding: 10px;
        border-radius: 10px;
        border: 1px solid #e5e7eb;
        cursor: pointer;
        margin-top: 6px;
      }

      .choice.selected {
        background: #eef2ff;
        border-color: #6366f1;
      }

      .muted {
        color: var(--muted);
        font-size: 14px;
      }
    </style>
  </head>

  <body>
    <header>
      <div>
        <h1>🎨 Fashion AI — Test Màu Cá Nhân</h1>
        <p>Kết hợp phân tích ảnh & quiz để xác định nhóm màu cá nhân</p>
      </div>
      <button class="btn" onclick="location.href='index.html'">
        ← Trang chủ
      </button>
    </header>

    <div class="container">
      <!-- CỘT TRÁI -->
      <div class="card">
        <h3>Tải ảnh khuôn mặt</h3>
        <input id="file" type="file" accept="image/*" />
        <img id="preview" alt="Ảnh xem trước" />
        <div id="status" class="muted"></div>
        <button
          id="analyzeBtn"
          class="btn"
          style="display: none; margin-top: 8px"
        >
          Phân tích ảnh
        </button>
        <div class="palette" id="palette"></div>
        <div id="summary" class="muted" style="margin-top: 8px">
          Chưa có dữ liệu.
        </div>
      </div>

      <!-- CỘT PHẢI -->
      <div class="card">
        <div id="quizCard">
          <h3>Bài Test 15 Câu — Personal Color</h3>
          <div id="questionArea"></div>
          <div style="margin-top: 10px">
            <button id="prevBtn" class="btn">◀</button>
            <button id="nextBtn" class="btn">▶</button>
          </div>
        </div>

        <div id="resultCard" style="display: none">
          <h3>Kết quả của bạn</h3>
          <div id="finalProfile"></div>
          <div id="aiMessage" class="muted" style="margin-top: 8px"></div>
          <button id="toChat" class="btn" style="margin-top: 10px">
            💬 Chat với AI Stylist
          </button>
        </div>
      </div>
    </div>

    <script>
      // ================= QUIZ DATA =================
      const QUESTIONS = [
        {
          q: "1) Khi bạn đứng dưới ánh sáng tự nhiên, da bạn trông:",
          a: ["Vàng / ấm", "Hồng / lạnh"],
        },
        { q: "2) Màu mạch máu ở cổ tay bạn:", a: ["Xanh lá", "Xanh tím/đỏ"] },
        { q: "3) Trang sức nào khiến bạn sáng hơn:", a: ["Vàng", "Bạc"] },
        {
          q: "4) Khi mặc áo trắng, bạn hợp hơn với:",
          a: ["Trắng kem", "Trắng tinh"],
        },
        { q: "5) Son làm bạn tươi hơn:", a: ["Đỏ cam", "Đỏ hồng"] },
        { q: "6) Màu tóc tự nhiên của bạn:", a: ["Nâu sáng", "Đen / nâu đậm"] },
        { q: "7) Màu mắt của bạn:", a: ["Nâu sáng / xanh", "Đen / xám"] },
        { q: "8) Khi mặc đồ tối, bạn trông:", a: ["Nổi bật", "Già đi"] },
        {
          q: "9) Khi mặc pastel, bạn thấy mình:",
          a: ["Tươi trẻ hơn", "Nhạt, chìm"],
        },
        {
          q: "10) Độ tương phản tóc–da–mắt của bạn:",
          a: ["Nhẹ nhàng", "Tương phản mạnh"],
        },
        {
          q: "11) Bạn hợp với màu:",
          a: ["Rực rỡ, bão hòa", "Dịu nhẹ, pastel"],
        },
        { q: "12) Bạn thích họa tiết:", a: ["Rõ nét", "Hòa trộn nhẹ"] },
        { q: "13) Bạn hợp phong cách:", a: ["Năng động", "Thanh lịch"] },
        { q: "14) Ánh sáng trắng khiến da bạn:", a: ["Tươi sáng", "Mịn, dịu"] },
        {
          q: "15) Môi trường sinh hoạt thường:",
          a: ["Ngoài trời", "Trong nhà"],
        },
      ];

      let cur = 0,
        answers = Array(15).fill(null);
      const questionArea = document.getElementById("questionArea");
      const prevBtn = document.getElementById("prevBtn");
      const nextBtn = document.getElementById("nextBtn");
      const resultCard = document.getElementById("resultCard");
      const quizCard = document.getElementById("quizCard");

      function renderQuestion() {
        const q = QUESTIONS[cur];
        questionArea.innerHTML =
          `<strong>${q.q}</strong>` +
          q.a
            .map(
              (t, i) =>
                `<div class="choice ${
                  answers[cur] === i ? "selected" : ""
                }" data-idx="${i}">${t}</div>`
            )
            .join("");
        questionArea.querySelectorAll(".choice").forEach((c) => {
          c.onclick = () => {
            answers[cur] = +c.dataset.idx;
            renderQuestion();
          };
        });
      }

      prevBtn.onclick = () => {
        if (cur > 0) {
          cur--;
          renderQuestion();
        }
      };
      nextBtn.onclick = () => {
        if (answers[cur] == null) {
          alert("Chọn đáp án trước!");
          return;
        }
        if (cur < QUESTIONS.length - 1) {
          cur++;
          renderQuestion();
        } else showResult();
      };

      renderQuestion();

      function showResult() {
        quizCard.style.display = "none";
        resultCard.style.display = "block";
        const score = answers.filter((a) => a === 0).length;
        const undertone = score > 7 ? "Warm" : "Cool";
        finalProfile.innerHTML = `<b>Tone Quiz:</b> ${undertone} (${score}/15 câu)`;
        aiMessage.textContent =
          undertone === "Warm"
            ? "🌸 Bạn thuộc tone ấm — hợp với cam, nâu, be, vàng."
            : "❄️ Bạn thuộc tone lạnh — hợp với xanh, tím, hồng lạnh, bạc.";

        // Lưu vào localStorage
        const existing = JSON.parse(
          localStorage.getItem("userProfile") || "{}"
        );
        existing.quizTone = undertone;
        localStorage.setItem("userProfile", JSON.stringify(existing));
      }

      // ================= IMAGE ANALYSIS =================
      const file = document.getElementById("file"),
        preview = document.getElementById("preview");
      const status = document.getElementById("status"),
        palette = document.getElementById("palette"),
        analyzeBtn = document.getElementById("analyzeBtn"),
        summary = document.getElementById("summary");
      let imgBase64 = "";

      file.onchange = () => {
        const f = file.files[0];
        if (!f) return;
        const r = new FileReader();
        r.onload = (e) => {
          imgBase64 = e.target.result;
          preview.src = imgBase64;
          preview.style.display = "block";
          analyzeBtn.style.display = "inline-block";
          status.textContent = "Ảnh sẵn sàng, nhấn 'Phân tích ảnh'!";
        };
        r.readAsDataURL(f);
      };

      analyzeBtn.onclick = async () => {
        try {
          analyzeBtn.disabled = true;
          status.textContent = "Đang phân tích...";
          const res = await fetch("https://fashionai-backend.onrender.com/analyze_image", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ image: imgBase64 }),
          });
          const data = await res.json();
          if (data.error) {
            status.textContent = "❌ " + data.error;
            return;
          }
          palette.innerHTML = "";
          (data.colors || []).forEach((c) => {
            const d = document.createElement("div");
            d.className = "color";
            d.style.background = c;
            palette.appendChild(d);
          });
          summary.innerHTML = `Tone AI: <b>${data.tone}</b><br>Màu chính: <b>${data.main_color}</b>`;
          status.textContent = "✅ Hoàn tất!";

          // Lưu vào localStorage
          const prof = JSON.parse(localStorage.getItem("userProfile") || "{}");
          prof.tone = data.tone;
          prof.palette = data.colors;
          prof.main_color = data.main_color;
          prof.faceImg = imgBase64;
          localStorage.setItem("userProfile", JSON.stringify(prof));
        } catch (e) {
          status.textContent = "⚠️ Lỗi: " + e.message;
        }
        analyzeBtn.disabled = false;
      };

      document.getElementById("toChat").onclick = () =>
        (location.href = "chat.html");
    </script>
  </body>
</html>
